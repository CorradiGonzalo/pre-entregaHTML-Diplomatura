<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto | Rienda</title>
</head>
<body>
    <header>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="sobrenosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contactanos</h1>
        <section>
            <h2>Escribinos</h2>
            <form action="#" method="post">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Gonzalo" required>
                </div>

                <div>
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej: Corradi" required>
                </div>

                <div>
                    <label for="email">E-Mail:</label>
                    <input type="email" id="email" name="email" placeholder="corradi.gonzalo@gmail.com" required>
                </div>

                <div>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" placeholder="18" min="0" max="120">
                </div>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <section class="nuestras-oficinas">
            <h2>¿Dónde están nuestras oficinas?</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d108978.1189332219!2d-64.26252431671563!3d-31.40308053702581!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432985f478f5b69%3A0xb612a2a0c4f1c1f2!2sC%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1700000000000!5m2!1ses-419!2sar"
                width="600"
                height="450"
                style="border: 0;"
                title="Ubicación geográfica de las oficinas"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
    </main>

    <footer>
        <nav aria-label="Navegación del pie de página">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="sobrenosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <p><small>&copy; 2026 Gonzalo Corradi. Todos los derechos reservados.</small></p>
    </footer>
</body>
</html>
